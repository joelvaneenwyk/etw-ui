# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev

version: "3"

vars:
  VCPKG_BOOTSTRAP_BAT: "{{.TASKFILE_DIR}}/external/vcpkg/bootstrap-vcpkg.bat"
  VCPKG_BOOTSTRAP_SH: "{{.TASKFILE_DIR}}/external/vcpkg/bootstrap-vcpkg.sh"
  VCPKG_EXE: "{{.TASKFILE_DIR}}/external/vcpkg/vcpkg.exe"

  RUN_WINDOWS: 'cmd /d /c'
  RUN_UNIX: 'sh -c'
  RUN: '{{if eq OS "windows"}}{{.RUN_WINDOWS}}{{ else }}{{.RUN_UNIX}}{{ end }}'

  SOLUTIONS:
    - UIforETW\UIforETW.sln
    - ETWProviders\ETWProviders.sln

  DEFAULT_CONFIG: Release
  DEFAULT_PLATFORM: x64
  DEFAULT_SOLUTION: '{{index .SOLUTIONS 0}}'
  BUILD_DIR: .build

  EXE: '{{joinPath "bin" "UIforETW_devrel.exe"}}'

env:
  VCPKG_DISABLE_METRICS: 1
  CGO_ENABLED: 1

tasks:
  default:
    cmds:
      - task: build

  run:
    deps: [build]
    cmds:
      - cmd: |
          cmd.exe /D /C call "{{ joinPath .TASKFILE_DIR (trim .EXE) | fromSlash }}" {{.CLI_ARGS}}

  rebuild:
    cmds:
      - task: clean
      - task: build

  clean:
    cmds:
      - task: delete
        vars: { TARGET_DIR: '{{.BUILD_DIR}}' }

  build:
    cmds:
      - task: msbuild
        vars: { MSBUILD_SOLUTION: '{{.DEFAULT_SOLUTION}}' }

  msbuild:
    aliases: [build, b]
    silent: true
    vars:
      MSBUILD:
        sh: | # shell
          strings=("Preview" "Enterprise" "Professional" "Community")
          for str in "${strings[@]}"
          do
            result="C:/Program Files/Microsoft Visual Studio/2022/${str}/MSBuild/Current/Bin/amd64/MSBuild.exe"
            if [ -e "$result" ]; then
              echo "$result"
              break
            fi
          done
      MSBUILD_CONFIG: '{{ .CONFIG | default .DEFAULT_CONFIG }}'
      MSBUILD_SOLUTION: '{{ joinPath .TASKFILE_DIR (.SOLUTION | default .DEFAULT_SOLUTION) }}'
      MSBUILD_PLATFORM: '{{ .PLATFORM | default .DEFAULT_PLATFORM }}'
    cmds:
      - cmd: echo "Building '{{ .MSBUILD_SOLUTION }}' with '{{ .MSBUILD_CONFIG }}' configuration."
      - cmd: >-
          "{{fromSlash .MSBUILD}}"
          /m
          /t:Build
          /p:Configuration="{{.MSBUILD_CONFIG}}"
          /p:Platform="{{.MSBUILD_PLATFORM}}"
          "{{fromSlash .MSBUILD_SOLUTION}}"

  git-submodule-init:
    sources:
      - .gitmodules
    generates:
      - '{{.BUILD_DIR}}/logs/git-submodule-init.log'
    cmds:
      - cmd: |
          git -C "{{.TASKFILE_DIR}}" submodule update --init --recursive
      - cmd: |
          mkdir -p {{.BUILD_DIR}}/logs
          touch {{.BUILD_DIR}}/logs/git-submodule-init.log

  vcpkg-integrate:
    deps: [vcpkg-download]
    internal: true
    cmds:
      - cmd: '{{.RUN}} "{{ fromSlash .VCPKG_EXE }}" integrate install'

  vcpkg-download:
    deps: [git-submodule-init]
    status:
      - test -f "{{.VCPKG_EXE}}"
    cmds:
      - cmd: '{{.RUN}} "{{ fromSlash .VCPKG_BOOTSTRAP_BAT }}" -disableMetrics'

  delete:
    internal: true
    requires: { vars: [TARGET_DIR] }
    status:
      - test ! -e "{{.TARGET_DIR}}"
    cmds:
      - cmd: |
          {{.RUN}} if exist "{{.TARGET_DIR}}" rmdir /s /q "{{.TARGET_DIR}}"
        platforms: [windows]
      - cmd: |
          rm -rf "{{.TARGET_DIR}}"
        platforms: [linux, darwin]
