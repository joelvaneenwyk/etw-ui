[project]
name = "etw-ui"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Joel Van Eenwyk", email = "joel.vaneenwyk@gmail.com" }
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.5.6",
    "mypy>=1.11.1",
    "pylint>=3.2.6",
    "pyright>=1.1.374",
    "isort>=5.13.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/etw_ui"]

[tool.pylint]
max-line-length = 120
indent-string = "  "
